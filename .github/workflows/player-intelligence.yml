name: Player Intelligence

on:
  workflow_dispatch:
    inputs:
      roster:
        description: "JSON mit dem aktuellen persönlichen Kickbase-Kader"
        required: false
        type: string
        default: "[]"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-player-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aktuellen Kader bereitstellen
        env:
          ROSTER_INPUT: ${{ inputs.roster }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("ROSTER_INPUT", "[]").strip()

          try:
              roster = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Ungültiges roster-JSON: {exc}")

          if not isinstance(roster, list):
              raise SystemExit("roster muss eine JSON-Liste sein.")

          clean = []
          seen = set()

          for item in roster:
              if isinstance(item, str):
                  player_id = item.strip()
                  player = {"id": player_id}
              elif isinstance(item, dict):
                  player_id = str(item.get("id", "")).strip()
                  player = {
                      "id": player_id,
                      "name": item.get("name", ""),
                      "club": item.get("club", ""),
                      "position": item.get("position", ""),
                  }
              else:
                  continue

              if not player_id or player_id in seen:
                  continue

              seen.add(player_id)
              clean.append(player)

          if len(clean) > 18:
              raise SystemExit(
                  f"Der übergebene Kader enthält {len(clean)} Spieler. Maximal 18 erlaubt."
              )

          Path("kickbase-roster.json").write_text(
              json.dumps(
                  {
                      "version": 1,
                      "source": "Kickbase AI manueller Kader",
                      "players": clean,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(f"Aktueller Kader bereitgestellt: {len(clean)}/18 Spieler")
          for player in clean:
              print(
                  f"- {player.get('name') or player['id']} "
                  f"({player.get('club') or 'Verein unbekannt'})"
              )
          PY

      - name: Player Intelligence aktualisieren
        run: python scripts/update_player_intelligence.py

      - name: Änderungen prüfen
        id: changes
        run: |
          if git diff --quiet -- player-intelligence.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Änderungen committen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-intelligence.json
          git commit -m "Update Player Intelligence"
          git push
