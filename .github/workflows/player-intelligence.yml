name: Player Intelligence

on:
  workflow_dispatch:
    inputs:
      roster:
        description: "JSON mit dem aktuellen persönlichen Kickbase-Kader"
        required: false
        type: string
        default: "[]"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-player-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aktuellen Kader validieren und bereitstellen
        env:
          ROSTER_INPUT: ${{ inputs.roster }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("ROSTER_INPUT", "").strip()
          print("ROSTER_INPUT erhalten:", repr(raw))

          if not raw:
              raise SystemExit(
                  "Kein persönlicher Kader übergeben. "
                  "Workflow wird aus Sicherheitsgründen abgebrochen."
              )

          try:
              roster = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Ungültiges roster-JSON: {exc}")

          if not isinstance(roster, list):
              raise SystemExit("roster muss eine JSON-Liste sein.")

          # Der Workflow-Input enthält bei unserem aktuellen Formular
          # bereits eine Liste aus Spieler-IDs. Wir übernehmen diese IDs
          # direkt, ohne sie erneut als Objekte zu interpretieren.
          ids = []
          seen = set()

          for item in roster:
              if isinstance(item, str):
                  player_id = item.strip()
              elif isinstance(item, dict):
                  player_id = str(item.get("id", "")).strip()
              else:
                  continue

              if player_id and player_id not in seen:
                  seen.add(player_id)
                  ids.append(player_id)

          if not ids:
              raise SystemExit(
                  "Der persönliche Kader enthält 0 gültige Spieler. "
                  "Workflow wird aus Sicherheitsgründen abgebrochen."
              )

          if len(ids) > 18:
              raise SystemExit(
                  f"Der übergebene Kader enthält {len(ids)} Spieler. "
                  "Maximal 18 erlaubt."
              )

          Path("kickbase-roster.json").write_text(
              json.dumps(
                  {
                      "version": 1,
                      "source": "Kickbase AI manueller Kader",
                      "players": ids,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(f"Aktueller Kader bereitgestellt: {len(ids)}/18 Spieler")
          print("Kader-IDs:", ", ".join(ids))
          PY

      - name: Kader-Übergabe prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("kickbase-roster.json").read_text(encoding="utf-8")
          )
          players = data.get("players", [])

          print(f"DIAGNOSE: {len(players)}/18 Spieler in kickbase-roster.json")
          print("DIAGNOSE-IDs:", ", ".join(str(p) for p in players))

          if not players:
              raise SystemExit("DIAGNOSE FEHLER: Kader ist leer.")
          PY

      - name: Player Intelligence aktualisieren
        run: python scripts/update_player_intelligence.py

      - name: Änderungen prüfen
        id: changes
        run: |
          if git diff --quiet -- player-intelligence.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Änderungen committen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-intelligence.json
          git commit -m "Update Player Intelligence"
          git push
