
name: Player Intelligence aktualisieren

on:
  workflow_dispatch:
    inputs:
      roster:
        description: "Kader als JSON-Liste (optional)"
        required: false
        default: "[]"

permissions:
  contents: write

jobs:
  update-player-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kader-Datei erstellen
        env:
          ROSTER_INPUT: ${{ inputs.roster }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("ROSTER_INPUT", "").strip()
          print("ROSTER_INPUT erhalten:")
          print(raw)

          if not raw:
              raw = "[]"
              print("Kein manueller Kader übergeben.")

          try:
              roster = json.loads(raw)
          except Exception as exc:
              raise SystemExit(
                  f"FEHLER: Ungültiges JSON: {exc}"
              )

          if not isinstance(roster, list):
              raise SystemExit(
                  "FEHLER: Kader muss eine JSON-Liste sein."
              )

          if len(roster) == 1 and isinstance(roster[0], list):
              roster = roster[0]

          Path("kickbase-roster.json").write_text(
              json.dumps(
                  {
                      "version": 1,
                      "source": "Kickbase AI manueller Kader",
                      "players": roster,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(f"Kader: {len(roster)} Einträge.")
          PY

      - name: Kader-Übergabe prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("kickbase-roster.json").read_text(
                  encoding="utf-8"
              )
          )
          players = data.get("players", [])

          print(f"DIAGNOSE: {len(players)}/18 Spieler")
          print("DIAGNOSE-IDs:", players)

          if not players:
              print("INFO: Allgemeine Aktualisierung.")

          if len(players) > 18:
              raise SystemExit(
                  "FEHLER: Mehr als 18 Spieler."
              )
          PY

      - name: Player Intelligence aktualisieren
        run: python scripts/update_player_intelligence.py

      - name: Änderungen prüfen
        id: changes
        run: |
          if git diff --quiet -- player-intelligence.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Änderungen committen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-intelligence.json
          git commit -m "Update Player Intelligence"
          git push
